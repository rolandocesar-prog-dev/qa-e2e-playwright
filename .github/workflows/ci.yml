name: E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Todos los días a las 11:17 UTC, para detectar cambios en el sitio bajo prueba.
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Imagen oficial con los navegadores y las fuentes: las capturas de VIS-01 son idénticas a las
    # de `npm run test:docker` en local (design.md). Al actualizar @playwright/test hay que
    # actualizar esta versión; si no coinciden, Playwright no encuentra sus navegadores y falla.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: npm ci

      - name: Lint, formato y tipos
        run: |
          npm run lint
          npm run format:check
          npm run typecheck

      - name: Pruebas E2E
        run: npm test

      - name: Reporte HTML
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      # El reporte se publica también cuando hay fallas: es cuando más sirve. No en pull requests.
      - name: Reporte para GitHub Pages
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: playwright-report/

  publish:
    name: Publicar el reporte
    needs: e2e
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.e2e.result != 'skipped' }}
    runs-on: ubuntu-latest
    # Una sola publicación del reporte a la vez; no se cancela una que ya empezó.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
